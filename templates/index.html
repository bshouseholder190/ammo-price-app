<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>9mm Ammo Alert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --g-dark:#1b5e20; --g-mid:#2e7d32; --g-light:#e8f5e9; }
        body  { background:#f4f6f4; }

        .navbar { background:var(--g-dark); }

        .btn-scan {
            background:var(--g-mid); border-color:var(--g-mid); color:#fff;
            padding:.55rem 1.8rem; font-size:1rem; font-weight:500;
        }
        .btn-scan:hover  { background:var(--g-dark); border-color:var(--g-dark); color:#fff; }
        .btn-scan:disabled { opacity:.65; pointer-events:none; }

        /* source cards */
        .src-card { border:1px solid #dde; border-left:4px solid; transition:border-left-color .25s; }
        .sc-pending { border-left-color:#bdbdbd; }
        .sc-queued  { border-left-color:#1976d2; }
        .sc-ok      { border-left-color:#2e7d32; }
        .sc-error   { border-left-color:#c62828; }

        .cpr { color:var(--g-mid); font-weight:700; }

        .table th { font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:#666; }
        .table td { vertical-align:middle; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .pulse { animation:pulse 1.4s ease-in-out infinite; }
    </style>
</head>
<body>

<nav class="navbar px-4 py-3 d-flex align-items-center">
    <span class="text-white fw-bold fs-5"><i class="bi bi-crosshair me-2"></i>9mm Ammo Alert</span>
    <button class="btn btn-outline-light btn-sm ms-auto"
            data-bs-toggle="collapse" data-bs-target="#settingsPane">
        <i class="bi bi-gear-fill me-1"></i>Settings
    </button>
</nav>

<div class="container py-4" style="max-width:880px">

    <!-- Settings -->
    <div class="collapse mb-4" id="settingsPane">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-semibold py-3">
                <i class="bi bi-sliders me-2"></i>Settings
            </div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-sm-4">
                        <label class="form-label small fw-semibold">Max price ($/round)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" id="cfgThreshold" class="form-control"
                                   step="0.01" min="0.05" max="1.00" value="0.25">
                        </div>
                    </div>
                    <div class="col-sm-8 d-flex align-items-end pb-1">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="cfgAutoEmail" role="switch">
                            <label class="form-check-label" for="cfgAutoEmail">
                                Auto-send email when deals found
                            </label>
                        </div>
                    </div>
                </div>
                <p class="small fw-semibold text-muted mb-2">Gmail</p>
                <div class="row g-3">
                    <div class="col-sm-4">
                        <label class="form-label small">From</label>
                        <input type="email" id="cfgSender" class="form-control" placeholder="you@gmail.com">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label small">To</label>
                        <input type="email" id="cfgRecipient" class="form-control" placeholder="you@gmail.com">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label small">App password</label>
                        <input type="password" id="cfgAppPw" class="form-control"
                               placeholder="xxxx xxxx xxxx xxxx" autocomplete="current-password">
                    </div>
                </div>
                <div class="mt-3" id="settingsSaveRow">
                    <button class="btn btn-success btn-sm" onclick="saveSettings()">
                        <i class="bi bi-floppy me-1"></i>Save settings
                    </button>
                </div>
                <div class="mt-3 d-none" id="settingsEnvNotice">
                    <span class="badge text-bg-info">Cloud deployment</span>
                    <span class="ms-2 small text-muted">Credentials are set via environment variables and cannot be changed here.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Control bar -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body d-flex flex-wrap align-items-center gap-3">
            <button class="btn btn-scan" id="scanBtn" onclick="startScan()">
                <i class="bi bi-search me-2"></i>Scan Now
            </button>
            <div class="flex-grow-1">
                <div id="scanStatus" class="small text-muted">Never scanned</div>
                <div id="scanBadge" class="mt-1"></div>
            </div>
            <div class="text-end">
                <div class="small text-muted">Threshold</div>
                <div id="thresholdLabel" class="fw-semibold" style="color:var(--g-mid)">$0.25 / round</div>
            </div>
        </div>
    </div>

    <!-- Source grid -->
    <div class="row g-2 mb-4" id="sourceGrid"></div>

    <!-- Case type filter -->
    <div id="caseFilter" class="d-none mb-3">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="small fw-semibold text-muted me-1">Case type:</span>
            <input type="checkbox" class="btn-check" id="cf_brass"    autocomplete="off" checked onchange="applyFilters()">
            <label class="btn btn-sm btn-outline-secondary" for="cf_brass"    id="lBrass">Brass</label>
            <input type="checkbox" class="btn-check" id="cf_steel"    autocomplete="off" checked onchange="applyFilters()">
            <label class="btn btn-sm btn-outline-secondary" for="cf_steel"    id="lSteel">Steel</label>
            <input type="checkbox" class="btn-check" id="cf_aluminum" autocomplete="off" checked onchange="applyFilters()">
            <label class="btn btn-sm btn-outline-secondary" for="cf_aluminum" id="lAluminum">Aluminum</label>
        </div>
    </div>

    <!-- Grain filter -->
    <div id="grainFilter" class="d-none mb-3">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="small fw-semibold text-muted me-1">Grain:</span>
            <div id="grainBtns" class="d-flex gap-2 flex-wrap"></div>
        </div>
    </div>

    <!-- Results table -->
    <div id="resultsCard" class="d-none">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white d-flex align-items-center py-3">
                <strong><i class="bi bi-table me-2"></i>Deals found</strong>
                <span class="badge rounded-pill ms-2"
                      style="background:var(--g-mid)" id="dealCount">0</span>
                <button class="btn btn-outline-success btn-sm ms-auto" onclick="sendEmail()">
                    <i class="bi bi-envelope me-1"></i>Send email
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Source</th>
                            <th>Product</th>
                            <th>Case</th>
                            <th>Per round</th>
                            <th>Total</th>
                            <th>Shipping</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="dealRows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- No deals -->
    <div id="noDealsCard" class="d-none text-center text-muted py-5">
        <i class="bi bi-inbox fs-1 d-block mb-2 opacity-40"></i>
        No deals found under threshold with free shipping
    </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:2000">
    <div id="appToast" class="toast border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body fw-medium" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let pollId   = null;
let _allDeals = [];
let _grainOptions = [];

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
    await loadSettings();
    render(await getStatus());
})();

// ── API ───────────────────────────────────────────────────────────────────────
const getStatus = () => fetch("/api/status").then(r => r.json());

async function loadSettings() {
    const c = await fetch("/api/settings").then(r => r.json());
    document.getElementById("cfgThreshold").value   = c.threshold  ?? 0.25;
    document.getElementById("cfgAutoEmail").checked = c.auto_email ?? false;
    document.getElementById("cfgSender").value    = c.email?.sender       ?? "";
    document.getElementById("cfgRecipient").value = c.email?.recipient    ?? "";
    document.getElementById("cfgAppPw").value     = c.email?.app_password ?? "";
    setThresholdLabel(c.threshold ?? 0.25);
    const envMode = !!c.env_mode;
    document.getElementById("settingsSaveRow").classList.toggle("d-none", envMode);
    document.getElementById("settingsEnvNotice").classList.toggle("d-none", !envMode);
    ["cfgSender","cfgRecipient","cfgAppPw"].forEach(id =>
        document.getElementById(id).disabled = envMode);
}

async function saveSettings() {
    const cfg = {
        threshold:  parseFloat(document.getElementById("cfgThreshold").value) || 0.25,
        auto_email: document.getElementById("cfgAutoEmail").checked,
        email: {
            sender:       document.getElementById("cfgSender").value.trim(),
            recipient:    document.getElementById("cfgRecipient").value.trim(),
            app_password: document.getElementById("cfgAppPw").value.trim(),
        }
    };
    const r = await fetch("/api/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cfg)
    });
    if (r.ok) { toast("Settings saved", "success"); setThresholdLabel(cfg.threshold); }
    else      { toast("Save failed", "danger"); }
}

async function startScan() {
    const r = await fetch("/api/run", {method: "POST"});
    if (r.status === 409) { toast("Scan already running", "warning"); return; }
    if (!r.ok)            { toast("Could not start scan", "danger");  return; }
    clearInterval(pollId);
    pollId = setInterval(async () => {
        const st = await getStatus();
        render(st);
        if (st.status !== "running") clearInterval(pollId);
    }, 900);
}

async function sendEmail() {
    const r = await fetch("/api/send-email", {method: "POST"});
    const d = await r.json();
    r.ok ? toast("Email sent!", "success") : toast(d.error || "Email failed", "danger");
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(st) {
    renderBar(st);
    renderSources(st);
    renderResults(st);
    if (st.status === "done") {
        if (st.email_sent)       toast("Email sent with deals!", "success");
        else if (st.email_error) toast("Email error: " + st.email_error, "warning");
    }
}

function renderBar(st) {
    const btn    = document.getElementById("scanBtn");
    const status = document.getElementById("scanStatus");
    const badge  = document.getElementById("scanBadge");
    const running = st.status === "running";

    btn.disabled  = running;
    btn.innerHTML = running
        ? '<span class="spinner-border spinner-border-sm me-2"></span>Scanning…'
        : '<i class="bi bi-search me-2"></i>Scan Now';

    if (!st.started_at) {
        status.textContent = "Never scanned";
        badge.innerHTML    = "";
    } else if (running) {
        status.textContent = "Scanning…";
        badge.innerHTML    = '<span class="badge text-bg-primary pulse">In progress</span>';
    } else {
        status.textContent = "Last scan: " + fmtTime(st.finished_at);
        const n = (st.deals || []).length;
        badge.innerHTML = n > 0
            ? `<span class="badge text-bg-success">${n} deal${n !== 1 ? "s" : ""}</span>`
            : '<span class="badge text-bg-secondary">No deals</span>';
    }
}

function renderSources(st) {
    const grid = document.getElementById("sourceGrid");
    if (!st.sources || !Object.keys(st.sources).length) { grid.innerHTML = ""; return; }
    const scanning = st.status === "running";

    grid.innerHTML = Object.entries(st.sources).map(([name, info]) => {
        const queued = scanning && info.status === "pending";
        const cls    = queued ? "sc-queued" : `sc-${info.status}`;

        let icon, detail;
        if (queued) {
            icon   = '<span class="spinner-border spinner-border-sm text-primary me-1" style="width:.75rem;height:.75rem"></span>';
            detail = '<span class="text-muted small">Queued</span>';
        } else if (info.status === "ok") {
            icon   = `<i class="bi bi-check-circle-fill text-success me-1"></i>`;
            detail = info.count > 0
                ? `<span class="fw-semibold" style="color:var(--g-mid)">${info.count} deal${info.count !== 1 ? "s" : ""}</span>`
                : '<span class="text-muted small">0 deals</span>';
        } else if (info.status === "error") {
            icon   = '<i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>';
            detail = `<span class="text-danger small" title="${esc(info.error || "")}">Error</span>`;
        } else {
            icon   = '<i class="bi bi-circle text-muted me-1"></i>';
            detail = '<span class="text-muted small">—</span>';
        }

        return `
        <div class="col-6 col-md-4">
            <div class="card src-card ${cls} shadow-sm h-100" style="border-radius:6px">
                <div class="card-body py-2 px-3">
                    <div class="small fw-semibold">${icon}${esc(name)}</div>
                    <div class="mt-1">${detail}</div>
                </div>
            </div>
        </div>`;
    }).join("");
}

function renderResults(st) {
    const cf = document.getElementById("caseFilter");
    const gf = document.getElementById("grainFilter");
    if (!st.finished_at) {
        document.getElementById("resultsCard").classList.add("d-none");
        document.getElementById("noDealsCard").classList.add("d-none");
        cf.classList.add("d-none");
        gf.classList.add("d-none");
        return;
    }
    _allDeals = st.deals || [];
    updateFilterCounts(_allDeals);
    buildGrainButtons(_allDeals);
    cf.classList.toggle("d-none", _allDeals.length === 0);
    gf.classList.toggle("d-none", _allDeals.length === 0);
    applyFilters();
}

function buildGrainButtons(deals) {
    const counts = {};
    deals.forEach(d => {
        const g = d.grain || "other";
        counts[g] = (counts[g] || 0) + 1;
    });
    const sorted = Object.keys(counts).sort((a, b) => {
        if (a === "other") return 1;
        if (b === "other") return -1;
        return parseInt(a) - parseInt(b);
    });
    const container = document.getElementById("grainBtns");
    container.innerHTML = sorted.map(g => {
        const label = g === "other" ? "Other" : g + "gr";
        return `
        <input type="checkbox" class="btn-check" id="gf_${g}" autocomplete="off" checked onchange="applyFilters()">
        <label class="btn btn-sm btn-outline-secondary" for="gf_${g}">${label} (${counts[g]})</label>`;
    }).join("");
    _grainOptions = sorted;
}

function updateFilterCounts(deals) {
    const counts = { brass: 0, steel: 0, aluminum: 0 };
    deals.forEach(d => { const t = d.case_type || "brass"; if (t in counts) counts[t]++; else counts.brass++; });
    document.getElementById("lBrass").textContent    = "Brass"    + (counts.brass    ? ` (${counts.brass})`    : "");
    document.getElementById("lSteel").textContent    = "Steel"    + (counts.steel    ? ` (${counts.steel})`    : "");
    document.getElementById("lAluminum").textContent = "Aluminum" + (counts.aluminum ? ` (${counts.aluminum})` : "");
}

function applyFilters() {
    const rc = document.getElementById("resultsCard");
    const nd = document.getElementById("noDealsCard");
    const active = new Set(["brass","steel","aluminum"].filter(t => document.getElementById("cf_" + t)?.checked));
    const activeGrain = new Set(_grainOptions.filter(g => document.getElementById("gf_" + g)?.checked));
    const filtered = _allDeals.filter(d =>
        active.has(d.case_type || "brass") &&
        (activeGrain.size === 0 || activeGrain.has(d.grain || "other"))
    );

    if (filtered.length > 0) {
        rc.classList.remove("d-none");
        nd.classList.add("d-none");
        document.getElementById("dealCount").textContent = filtered.length;
        document.getElementById("dealRows").innerHTML = filtered.map(d => {
            const rounds = extractRounds(d.name);
            const total  = rounds ? "$" + (rounds * d.cpr).toFixed(2) : "—";
            return `
            <tr>
                <td><span class="badge text-bg-secondary">${esc(d.source)}</span></td>
                <td class="small">${esc(d.name.slice(0, 72))}</td>
                <td>${caseBadge(d.case_type || "brass")}</td>
                <td><span class="cpr">$${d.cpr.toFixed(3)}</span></td>
                <td class="small fw-semibold">${total}</td>
                <td><span class="badge" style="background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7">Free</span></td>
                <td>
                    <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer"
                       class="btn btn-sm btn-outline-primary py-0 px-2">Buy &rarr;</a>
